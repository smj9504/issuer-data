[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "issuer-data"
version = "0.1.0"
description = "Multi-market issuer/security data collector (DART, KRX, HKEXnews, SEC EDGAR, yfinance, FMP, Alpha Vantage) into a unified SQLite DB"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    # pandas 2.2.2 dropped the numpy<2 cap, which conflicts with pykrx's numpy>=2.
    "pandas>=2.2.2",
    "requests>=2.32",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    "tenacity>=8.3",
    "pykrx>=1.2.8",
    "yfinance>=0.2.40",
    # OpenDartReader 0.2.3 declares Requires-Python >=3.13, so it is unusable on the
    # 3.10-3.12 this project supports; >=0.2.2 lets pip take 0.2.3 only where it fits.
    "OpenDartReader>=0.2.2",
    "pdfplumber>=0.11",
    "olefile>=0.46",
    # OCR of image-only PDFs is on by default, so its Python side is not optional.
    # Tesseract itself is a system package — see the `ocr` extra's note below.
    "pymupdf>=1.24",
    "pytesseract>=0.3.10",
    "Pillow>=10.0",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "ruff>=0.5",
    "reportlab>=4.0",   # builds synthetic PDFs for the structured-extraction test
]
# Kept so `pip install '.[ocr]'` still resolves; these moved into the runtime
# dependencies when OCR became the default. The Tesseract binary is still a system
# package: `apt install tesseract-ocr tesseract-ocr-kor tesseract-ocr-chi-tra`.
ocr = [
    "pymupdf>=1.24",    # render PDF pages to images
    "pytesseract>=0.3.10",
    "Pillow>=10.0",
]

[project.scripts]
issuer-data = "issuer_data.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
issuer_data = ["storage/*.sql"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Local dates are intentional (ISO date strings, no tz needed); %-format and the
# `x == x` NaN idiom are deliberate. Ignore those pedantic rules.
ignore = ["DTZ001", "DTZ005", "DTZ007", "DTZ011", "UP031", "PLR0124", "RUF059", "RUF012"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
